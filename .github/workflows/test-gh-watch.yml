name: Test gh-watch formula

on:
  push:
    paths:
      - Formula/gh-watch.rb
      - .github/workflows/test-gh-watch.yml
  pull_request:
    paths:
      - Formula/gh-watch.rb

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install from tap
        run: |
          brew tap masesor/tap
          brew install --force-bottle masesor/tap/gh-watch
      - name: Verify binary
        run: gh-watch --version
